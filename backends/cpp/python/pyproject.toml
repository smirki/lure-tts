[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lure-cpp"
version = "0.1.0"
description = "Lure TTS backend over the C++ library liblure_tts (ggml: Metal, CUDA, Vulkan, CPU)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "lure-tts",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.entry-points."lure.backends"]
cpp = "lure_cpp:CppBackend"

[tool.setuptools.packages.find]
include = ["lure_cpp*"]
